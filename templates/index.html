<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Desk — Market Watchlist</title>
    <meta name="description" content="A focused workspace for market monitoring, alerts, news, and investment research.">
    <meta name="theme-color" content="#153e2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ asset_v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/watchlist.css') }}?v={{ asset_v }}">
</head>
<body>
    <header class="appbar">
  <div class="appbar-inner">
    <a href="/" class="appbar-brand" aria-label="Research Desk home">
      <span class="appbar-mark" aria-hidden="true"></span>
      <span class="appbar-name"><b>Research Desk</b><span>Private market workspace</span></span>
    </a>
    <nav class="appbar-nav" aria-label="Primary">
      <a href="/" class="appbar-link is-active" aria-current="page">Watchlist</a>
      <a href="/movers" class="appbar-link">Movers</a>
      <a href="/voice" class="appbar-link">Chat</a>
      <a href="/todos" class="appbar-link">To-do</a>
      <a href="/logout" class="appbar-link appbar-signout">Sign out</a>
    </nav>
  </div>
</header>

    <main class="container">
        <section class="page-heading" aria-labelledby="page-title">
            <div class="eyebrow">Market intelligence</div>
            <h2 id="page-title">Watchlist</h2>
            <p>The names you monitor for news and alerts. Add a ticker, choose its exchange.</p>
        </section>

        <section class="dashboard-grid" id="dashboard-summary" aria-label="Watchlist overview">
            <form class="add-form" id="add-form">
                <div class="panel-heading">
                    <div>
                        <h3>Add to watchlist</h3>
                        <p>We’ll verify the listing before adding it.</p>
                    </div>
                </div>
                <div class="form-fields">
                    <div class="form-group">
                        <label for="ticker-input">Ticker</label>
                        <input type="text" id="ticker-input" placeholder="AAPL" autocomplete="off" autocapitalize="characters" required>
                    </div>
                    <div class="form-group">
                        <label for="exchange-input">Exchange</label>
                        <select id="exchange-input">
                            {% for ex in exchanges %}
                            <option value="{{ ex }}">{{ ex }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary add-submit">Add stock</button>
                </div>
            </form>

            <div class="stats" id="stats" aria-label="Watchlist statistics"></div>
        </section>

        <section class="workspace-section">
            <div class="tab-header">
                <div class="tabs" role="tablist" aria-label="Workspace views">
                    <button class="tab active" role="tab" aria-selected="true" data-tab="watchlist" onclick="switchTab('watchlist')">Watchlist <span class="tab-count" id="tab-watchlist-count">0</span></button>
                    <button class="tab" role="tab" aria-selected="false" data-tab="news" onclick="switchTab('news')">News</button>
                    <button class="tab" role="tab" aria-selected="false" data-tab="announcements" onclick="switchTab('announcements')">Announcements</button>
                    <button class="tab" role="tab" aria-selected="false" data-tab="alerts" onclick="switchTab('alerts')">Alerts <span class="tab-count" id="tab-alerts-count">0</span></button>
                    <button class="tab" role="tab" aria-selected="false" data-tab="research" onclick="switchTab('research')">Notes</button>
                </div>
                <div class="view-actions" id="watchlist-actions">
                    <label class="search-wrap" for="watchlist-search">
                        <input type="search" id="watchlist-search" aria-label="Search watchlist" placeholder="Search ticker, company, note…" oninput="filterWatchlist()">
                    </label>
                    <span class="result-count" id="watchlist-result-count"></span>
                </div>
                <button class="btn btn-ghost" id="clear-alerts-btn" style="display:none;" onclick="clearAlerts()">Clear history</button>
                <div class="view-actions" id="news-actions" style="display:none;">
                    <button class="btn btn-ghost" id="clear-news-btn" onclick="clearNews()">Clear news</button>
                    <button class="btn btn-ghost" id="stop-news-btn" style="display:none;" onclick="stopNews()">■ Stop</button>
                    <button class="btn btn-primary" id="scan-news-btn" onclick="scanNews()">Scan news</button>
                </div>
                <div class="view-actions" id="announcements-actions" style="display:none;">
                    <button class="btn btn-ghost" id="ann-log-btn" onclick="toggleAnnLog()">View log</button>
                    <button class="btn btn-ghost" id="clear-ann-btn" onclick="clearAnnouncements()">Clear</button>
                    <button class="btn btn-ghost" id="stop-ann-btn" style="display:none;" onclick="stopAnnouncements()">■ Stop</button>
                    <button class="btn btn-primary" id="scan-ann-btn" onclick="scanAnnouncements()">Scan announcements</button>
                </div>
                <button class="btn btn-ghost btn-check" id="check-now-btn" onclick="checkNow()" style="margin-left:auto;">↗ Check now</button>
            </div>

            <div class="table-container" id="watchlist-view" role="tabpanel">
                <table>
                <thead>
                    <tr>
                        <th scope="col">Company</th>
                        <th scope="col">Exchange</th>
                        <th scope="col">Monitoring</th>
                        <th scope="col">Added</th>
                        <th scope="col"><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody id="watchlist-body">
                </tbody>
                </table>
                <div class="pagination" id="watchlist-pagination"></div>
            </div>

            <div class="table-container" id="alerts-view" role="tabpanel" style="display: none;">
                <div class="alert-subtabs" id="alert-subtabs"></div>
                <div id="alerts-list"></div>
            </div>

            <div id="news-view" role="tabpanel" style="display: none;">
                <div id="news-meta" class="news-meta"></div>
                <div id="news-list"></div>
            </div>

            <div id="announcements-view" role="tabpanel" style="display: none;">
                <div id="announcements-meta" class="news-meta"></div>
                <pre id="announcements-log" class="ann-log" style="display:none;"></pre>
                <div id="announcements-list"></div>
            </div>

            <div id="research-view" role="tabpanel" style="display: none;">
            <!-- Level 1: Ticker list -->
            <div id="research-list-view">
                <div class="research-controls">
                    <input type="search" id="research-search" aria-label="Search research notes" placeholder="Search notes…" oninput="filterResearch()">
                    <button class="btn btn-primary" onclick="toggleNewNoteForm()">+ New Note</button>
                </div>

                <div class="new-note-form" id="new-note-form">
                    <div class="new-note-row">
                        <div class="form-group">
                            <label>Ticker</label>
                            <input type="text" id="new-research-ticker" placeholder="INOXINDIA">
                        </div>
                        <div class="form-group">
                            <label>Note Title</label>
                            <input type="text" id="new-research-slug" placeholder="concall_q4_fy25" style="width:200px; font-family:'JetBrains Mono',monospace; font-size:0.82rem;">
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button class="btn btn-primary" onclick="createResearchNote()">Create</button>
                        </div>
                    </div>
                </div>

                <div class="research-grid" id="research-grid"></div>
            </div>

            <!-- Level 2: Ticker detail (list of notes) -->
            <div class="research-detail" id="research-ticker-view">
                <button class="research-back" onclick="backToTickerList()">← All Tickers</button>
                <div class="research-detail-header">
                    <h2><span id="research-ticker-title"></span> <span style="font-size:0.75rem; color:var(--text-muted); font-family:'DM Sans',sans-serif; font-weight:500;" id="research-ticker-count"></span></h2>
                    <div class="research-detail-actions">
                        <button class="btn btn-primary" style="font-size:0.75rem; padding:0.35rem 0.85rem;" onclick="addNoteToTicker()">+ Add Note</button>
                        <button class="btn btn-primary" style="font-size:0.75rem; padding:0.35rem 0.85rem; background: var(--text);" onclick="window.open('/share/' + currentTicker, '_blank')">📄 PDF</button>
                        <button class="btn btn-ghost" onclick="deleteTickerNotes()">✕ Delete All</button>
                    </div>
                </div>
                <div class="research-grid" id="research-notes-grid"></div>
            </div>

            <!-- Level 3: Note reader/editor -->
            <div class="research-detail" id="research-note-view">
                <button class="research-back" id="research-note-back">← Back</button>
                <div class="research-detail-header">
                    <h2><span id="research-note-title"></span></h2>
                    <div class="research-detail-actions">
                        <button class="btn btn-primary" style="font-size:0.75rem; padding:0.35rem 0.85rem;" onclick="shareNote()">🔗 Share</button>
                        <button class="btn btn-ghost" id="research-edit-btn" onclick="toggleResearchEdit()">✎ Edit</button>
                        <button class="btn btn-ghost" onclick="deleteCurrentNote()">✕ Delete</button>
                    </div>
                </div>
                <div class="research-rendered" id="research-rendered"></div>
                <div class="research-editor" id="research-editor">
                    <div class="md-toolbar">
                        <button onclick="insertMd('heading1')" title="Heading 1">H1</button>
                        <button onclick="insertMd('heading2')" title="Heading 2">H2</button>
                        <button onclick="insertMd('heading3')" title="Heading 3">H3</button>
                        <div class="sep"></div>
                        <button onclick="insertMd('bold')" title="Bold"><b>B</b></button>
                        <button onclick="insertMd('italic')" title="Italic"><i>I</i></button>
                        <div class="sep"></div>
                        <button onclick="insertMd('bullet')" title="Bullet List">• List</button>
                        <button onclick="insertMd('numbered')" title="Numbered List">1. List</button>
                        <button onclick="insertMd('checklist')" title="Checklist">☑ Check</button>
                        <div class="sep"></div>
                        <button onclick="insertMd('quote')" title="Quote">❝ Quote</button>
                        <button onclick="insertMd('hr')" title="Horizontal Rule">— Rule</button>
                        <button onclick="insertMd('link')" title="Link">🔗 Link</button>
                        <button onclick="insertMd('table')" title="Table">⊞ Table</button>
                    </div>
                    <textarea id="research-textarea"></textarea>
                    <div class="research-editor-actions">
                        <button class="btn btn-ghost" onclick="cancelResearchEdit()">Cancel</button>
                        <button class="btn btn-primary" onclick="saveResearchNote()">Save</button>
                    </div>
                </div>
            </div>
            </div>
        </section>
    </main>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

        <script src="{{ url_for('static', filename='js/watchlist.js') }}?v={{ asset_v }}"></script>
</body>
</html>
